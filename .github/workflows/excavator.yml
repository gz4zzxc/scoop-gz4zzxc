name: Auto Update Manifests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run at 8:00 AM Beijing Time (UTC+8) = 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: windows-latest
    concurrency:
      group: update-manifests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Validate JSON manifests
        shell: pwsh
        run: |
          Write-Host 'Validating manifest JSON...' -ForegroundColor Cyan
          Get-ChildItem bucket -Filter *.json | ForEach-Object {
            try {
              Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
              Write-Host "✅ $($_.Name) is valid JSON"
            } catch {
              Write-Host "❌ $($_.Name) has invalid JSON: $($_.Exception.Message)" -ForegroundColor Red
              throw
            }
          }

      - name: Install Scoop (for checkver/autoupdate)
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          scoop config aria2-warning-enabled false
          scoop install git

      - name: Run checkver for all manifests
        id: checkver
        shell: pwsh
        run: |
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          if (-not (Test-Path $checkver)) {
            Write-Host "Downloading checkver.ps1 as fallback..." -ForegroundColor Yellow
            $checkver = Join-Path $env:RUNNER_TEMP 'checkver.ps1'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/bin/checkver.ps1' -OutFile $checkver
          }

          # Run each manifest in its own process so a transient upstream error
          # cannot prevent other manifests from updating and being committed.
          $failed = @()
          Get-ChildItem bucket -Filter '*.json' | Sort-Object Name | ForEach-Object {
            $manifest = $_
            Write-Host "Checking $($manifest.Name)..." -ForegroundColor Cyan
            & pwsh -NoProfile -File $checkver $manifest.FullName -Update -ThrowError
            if ($LASTEXITCODE -ne 0) {
              $failed += $manifest.Name
              Write-Host "::warning file=bucket/$($manifest.Name)::checkver exited with code $LASTEXITCODE; continuing" -ForegroundColor Yellow
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host "checkver warnings (updates from other manifests will still be committed): $($failed -join ', ')" -ForegroundColor Yellow
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "failed=$($failed -join ',')"

      - name: Re-validate hashes for stable-URL apps
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $stableUrlApps = @('aliyundrive', 'dida365', 'ndi-tools')
          $maxAttempts = 3
          $backoffSeconds = @(5, 15, 30)

          function Invoke-DownloadWithRetry {
            param(
              [Parameter(Mandatory)][string]$Uri,
              [Parameter(Mandatory)][string]$OutFile,
              [hashtable]$Headers = $null
            )
            $lastError = $null
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                if (Test-Path $OutFile) {
                  Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
                }
                $params = @{
                  Uri             = $Uri
                  OutFile         = $OutFile
                  UseBasicParsing = $true
                }
                if ($Headers) { $params['Headers'] = $Headers }
                Invoke-WebRequest @params
                if ((Test-Path $OutFile) -and ((Get-Item $OutFile).Length -gt 0)) {
                  return $true
                }
                throw "Downloaded file is missing or empty: $OutFile"
              } catch {
                $lastError = $_
                Write-Host "  Attempt $attempt/$maxAttempts failed: $($_.Exception.Message)" -ForegroundColor Yellow
                if ($attempt -lt $maxAttempts) {
                  $delay = $backoffSeconds[$attempt - 1]
                  Write-Host "  Retrying in ${delay}s..." -ForegroundColor Yellow
                  Start-Sleep -Seconds $delay
                }
              }
            }
            Write-Host "  Giving up after $maxAttempts attempts: $lastError" -ForegroundColor Red
            return $false
          }

          foreach ($app in $stableUrlApps) {
            $manifestPath = "bucket/$app.json"
            if (-not (Test-Path $manifestPath)) { continue }

            $raw = Get-Content $manifestPath -Raw -Encoding UTF8
            $manifest = $raw | ConvertFrom-Json
            $appUpdated = $false

            if ($app -eq 'aliyundrive') {
              $downloadUrl = "https://cdn.aliyundrive.net/downloads/apps/desktop/aDrive-$($manifest.version).exe"
              $tmpFile = Join-Path $env:RUNNER_TEMP "$app-64bit.exe"
              Write-Host "Re-validating $app (64bit): downloading..." -ForegroundColor Cyan
              $ok = Invoke-DownloadWithRetry -Uri $downloadUrl -OutFile $tmpFile -Headers @{ 'User-Agent' = $manifest.useragent }
              if (-not $ok) {
                Write-Host "  Skipping $app hash re-validation (download failed; non-fatal)" -ForegroundColor Yellow
                continue
              }
              $actualHash = (Get-FileHash $tmpFile -Algorithm SHA256).Hash.ToLower()
              Remove-Item $tmpFile -Force -ErrorAction SilentlyContinue

              $pattern = '(\$expectedHash\s*=\s*")[a-fA-F0-9]{64}(")'
              $updated = [regex]::Replace($raw, $pattern, "`$1$actualHash`$2", 1)
              if ($updated -ne $raw) {
                Write-Host "  Updating $app installer hash to $actualHash" -ForegroundColor Yellow
                $raw = $updated
                $appUpdated = $true
              } else {
                Write-Host "  Hash OK ($actualHash)" -ForegroundColor Green
              }

              if ($appUpdated) {
                Set-Content -Path $manifestPath -Value $raw -Encoding UTF8NoBOM -NoNewline
              }
              continue
            }

            foreach ($arch in @('64bit', '32bit')) {
              if (-not $manifest.architecture.$arch) { continue }
              $url = $manifest.architecture.$arch.url
              $expectedHash = $manifest.architecture.$arch.hash

              $downloadUrl = $url -replace '#/.*$', ''
              $tmpFile = Join-Path $env:RUNNER_TEMP "$app-$arch.exe"
              Write-Host "Re-validating $app ($arch): downloading..." -ForegroundColor Cyan
              $ok = Invoke-DownloadWithRetry -Uri $downloadUrl -OutFile $tmpFile
              if (-not $ok) {
                Write-Host "  Skipping $app ($arch) hash re-validation (download failed; non-fatal)" -ForegroundColor Yellow
                continue
              }
              $actualHash = (Get-FileHash $tmpFile -Algorithm SHA256).Hash.ToLower()
              Remove-Item $tmpFile -Force -ErrorAction SilentlyContinue

              if ($actualHash -ne $expectedHash.ToLower()) {
                Write-Host "  Hash mismatch! Expected=$expectedHash Actual=$actualHash" -ForegroundColor Yellow
                Write-Host "  Updating hash in manifest..." -ForegroundColor Yellow
                $pattern = [regex]::Escape($expectedHash)
                $raw = $raw -replace $pattern, $actualHash
                $appUpdated = $true
              } else {
                Write-Host "  Hash OK ($actualHash)" -ForegroundColor Green
              }
            }

            if ($appUpdated) {
              Set-Content -Path $manifestPath -Value $raw -Encoding UTF8NoBOM -NoNewline
            }
          }

      - name: Update README version table
        shell: pwsh
        run: |
          $path = 'README.md'
          if (-not (Test-Path $path)) { exit 0 }
          $originalContent = Get-Content $path -Raw -Encoding UTF8
          # Work on a mutable copy
          $script:content = $originalContent
          # Preserve existing newline style (LF vs CRLF)
          $nl = if ($originalContent -match "\r\n") { "`r`n" } else { "`n" }

          function Update-VersionRow([string]$app, [string]$version) {
            $escaped = [regex]::Escape($app)
            # Keep matching within a physical line and preserve either LF or CRLF.
            $pattern = "(?m)^(?<pre>\|[ \t]*$escaped[ \t]*\|[^\r\n]*\|[ \t]*)(?<ver>[^|\r\n]*?)(?<post>[ \t]*\|)(?<eol>\r?\n|$)"
            $match = [regex]::Match($script:content, $pattern)
            if ($match.Success) {
              $script:content = [regex]::Replace($script:content, $pattern, {
                return $args[0].Groups['pre'].Value + $version + $args[0].Groups['post'].Value + $args[0].Groups['eol'].Value
              }, 1)
              return
            }

            if (-not $match.Success) {
              # If the row does not exist, insert a new row after the header row
              $insert = "| $app | (auto) | $version |$nl"
              $tableHeader = "(?ms)(\|\s*App\s*\|.*?\|\s*Version\s*\|\s*\r?\n\|[-| ]+\r?\n)"
              if ([regex]::IsMatch($script:content, $tableHeader)) {
                $script:content = [regex]::Replace($script:content, $tableHeader, {
                  $args[0].Groups[1].Value + $insert
                }, 1)
              } else {
                # Fallback: append at end
                if (-not $script:content.EndsWith("`n")) { $script:content += $nl }
                $script:content += $insert
              }
            }
          }

          # App key must match the manifest filename (without .json) for the
          # row regex to work, so derive the list from bucket/*.json instead of
          # hardcoding it here (prevents drift when a new manifest is added).
          $apps = @(Get-ChildItem -LiteralPath 'bucket' -Filter '*.json' | Sort-Object Name | ForEach-Object {
            @{ key = [IO.Path]::GetFileNameWithoutExtension($_.Name); file = "bucket/$($_.Name)" }
          })

          foreach ($a in $apps) {
            try {
              $ver = (Get-Content $a.file -Raw | ConvertFrom-Json).version
              if ($ver) { Update-VersionRow -app $a.key -version $ver }
            } catch {
              Write-Host "Skip $($a.key): failed to read version" -ForegroundColor Yellow
            }
          }

          if ($originalContent -ne $script:content) {
            Set-Content -Path $path -Value $script:content -Encoding UTF8
            Write-Host 'README updated with latest versions.' -ForegroundColor Green
          } else {
            Write-Host 'README already up to date.'
          }

      - name: Validate README version table
        shell: pwsh
        run: |
          if (-not (Test-Path 'README.md')) {
            throw 'README.md does not exist; cannot validate the version table.'
          }

          $content = Get-Content -LiteralPath 'README.md' -Raw -Encoding UTF8
          # Derived from bucket/*.json so a newly added manifest is always
          # checked; a hardcoded list here would silently skip new apps.
          $apps = @(Get-ChildItem -LiteralPath 'bucket' -Filter '*.json' | Sort-Object Name | ForEach-Object {
            @{ key = [IO.Path]::GetFileNameWithoutExtension($_.Name); file = "bucket/$($_.Name)" }
          })
          $errors = @()

          foreach ($a in $apps) {
            try {
              $manifestVersion = [string](Get-Content -LiteralPath $a.file -Raw -Encoding UTF8 | ConvertFrom-Json).version
              $escaped = [regex]::Escape($a.key)
              $pattern = "(?m)^\|[ \t]*$escaped[ \t]*\|[^\r\n]*\|[ \t]*(?<version>[^|\r\n]*?)[ \t]*\|(?:\r?\n|$)"
              $match = [regex]::Match($content, $pattern)
              if (-not $match.Success) {
                $errors += "$($a.key): README row is missing"
                continue
              }

              $readmeVersion = $match.Groups['version'].Value.Trim()
              if ($readmeVersion -ne $manifestVersion) {
                $errors += "$($a.key): README=$readmeVersion manifest=$manifestVersion"
              }
            } catch {
              $errors += "$($a.key): failed to validate manifest/README row - $($_.Exception.Message)"
            }
          }

          if ($errors.Count -gt 0) {
            throw "README version table is inconsistent:`n$($errors -join "`n")"
          }
          Write-Host 'README version table matches all manifest versions.' -ForegroundColor Green

      - name: Show changes
        id: diff
        shell: pwsh
        run: |
          $changed = git status --porcelain -- bucket/*.json README.md
          $changed | Write-Host
          if (-not [string]::IsNullOrWhiteSpace($changed)) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'changed=true'
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'changed=false'
          }

      - name: Validate pull request autoupdate diff
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKVER_FAILED: ${{ steps.checkver.outputs.failed }}
        run: |
          $prFiles = @(git diff --name-only "$env:PR_BASE_SHA...$env:PR_HEAD_SHA" -- bucket README.md |
            Where-Object { $_ -match '^(?:bucket/[^/]+\.json|README\.md)$' })
          $prManifestFiles = @($prFiles | Where-Object { $_ -match '^bucket/[^/]+\.json$' })
          $generatedFiles = @(git diff --name-only -- bucket README.md |
            Where-Object { $_ -match '^(?:bucket/[^/]+\.json|README\.md)$' })
          $failedManifests = @()
          if (-not [string]::IsNullOrWhiteSpace($env:CHECKVER_FAILED)) {
            $failedManifests = @($env:CHECKVER_FAILED -split ',' | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          }
          $failedPaths = @($failedManifests | ForEach-Object { "bucket/$_" })

          Write-Host "Files changed by this PR:" -ForegroundColor Cyan
          if ($prFiles.Count -gt 0) { $prFiles | ForEach-Object { Write-Host "  $_" } } else { Write-Host '  (none)' }
          Write-Host "Manifest files changed by this PR:" -ForegroundColor Cyan
          if ($prManifestFiles.Count -gt 0) { $prManifestFiles | ForEach-Object { Write-Host "  $_" } } else { Write-Host '  (none)' }
          Write-Host "Files rewritten by autoupdate:" -ForegroundColor Cyan
          if ($generatedFiles.Count -gt 0) { $generatedFiles | ForEach-Object { Write-Host "  $_" } } else { Write-Host '  (none)' }
          Write-Host "Manifests whose checkver failed:" -ForegroundColor Cyan
          if ($failedManifests.Count -gt 0) { $failedManifests | ForEach-Object { Write-Host "  $_" } } else { Write-Host '  (none)' }

          $failedOverlap = @($prManifestFiles | Where-Object { $failedPaths -contains $_ })
          if ($failedOverlap.Count -gt 0) {
            throw "PR-owned manifests failed checkver: $($failedOverlap -join ', '). Fix the manifest before merging."
          }

          # README is generated from all manifests, so unrelated upstream updates may rewrite it.
          # Only PR-owned manifests are guarded against generated rewrites.
          $overlap = @($prManifestFiles | Where-Object { $generatedFiles -contains $_ })
          if ($overlap.Count -gt 0) {
            throw "Autoupdate rewrote manifests changed by this PR: $($overlap -join ', '). Update the PR to match the generated manifest content."
          }

          Write-Host 'PR-owned manifests did not fail or get rewritten by autoupdate.' -ForegroundColor Green

      - name: Commit changes
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/*.json README.md

          $manifestFiles = git diff --cached --name-only -- 'bucket/*.json'
          $manifestInfo = @()

          foreach ($file in $manifestFiles) {
            if (-not (Test-Path $file)) { continue }
            try {
              $json = Get-Content $file -Raw | ConvertFrom-Json
              $app = [IO.Path]::GetFileNameWithoutExtension($file)
              $version = $json.version
              if ($app -and $version) {
                $manifestInfo += [pscustomobject]@{ App = $app; Version = $version }
              }
            } catch {
              Write-Host "Skip commit summary for ${file}: $($_)" -ForegroundColor Yellow
            }
          }

          if ($manifestInfo.Count -eq 1) {
            $subject = "chore(bucket): bump $($manifestInfo[0].App) to $($manifestInfo[0].Version) [skip ci]"
          } elseif ($manifestInfo.Count -gt 1) {
            $preview = if ($manifestInfo.Count -le 3) { $manifestInfo } else { $manifestInfo[0..2] + '...' }
            $summary = $preview | ForEach-Object { if ($_ -is [string]) { $_ } else { "$($_.App) $($_.Version)" } }
            $subject = "chore(bucket): bump manifests ($($summary -join ', ')) [skip ci]"
          } elseif (git diff --cached --name-only -- 'README.md') {
            $subject = "docs: refresh README version table [skip ci]"
          } else {
            $subject = "chore: sync auto-generated files [skip ci]"
          }

          git commit -m $subject
          git push origin HEAD:main
